<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipRay · 翻译工作台交互原型</title>
<style>
:root{color-scheme:dark;font:15px/1.55 'Segoe UI','Microsoft YaHei UI',sans-serif;background:#10141c;color:#e8edf6}*{box-sizing:border-box}body{margin:0}button,select,textarea{font:inherit;color:inherit}button,select{background:#242d3c;border:1px solid #435169;border-radius:6px;padding:8px 13px;cursor:pointer}button:hover{background:#334158}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid #83c9ff;outline-offset:3px}.primary{background:#285b99;border-color:#75b8f7}header{padding:22px 30px 18px;border-bottom:1px solid #303a49;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:23px;margin:0}p{margin:5px 0;color:#abb9cc}.tag{color:#e0c581;font-size:12px}nav{padding:14px 30px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(360px,1.05fr) minmax(360px,1fr);gap:24px;padding:0 30px 26px}.canvas{background:#171d27;border:1px solid #354052;border-radius:8px;padding:24px;min-height:500px}.source{max-width:600px;margin:24px auto;background:#f8fafc;color:#162333;padding:38px 30px;border-radius:5px}.source h2{margin:0 0 24px;font-size:18px}.region{display:block;width:100%;text-align:left;color:#172334;background:transparent;border:2px solid transparent;padding:14px;margin:12px 0;border-radius:4px}.region:hover{background:#e5edf5}.region[aria-pressed=true]{border-color:#2478b7;background:#e5f1fb}.region small{display:block;color:#5b6878;margin-top:7px}.caption{display:flex;justify-content:space-between;gap:12px;color:#aebcd0}.list{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}.list button[aria-pressed=true]{border-color:#85caff;background:#243d56}.editor{border-top:1px solid #354052;padding-top:18px}label{display:block;color:#b6c5d8;margin:14px 0 7px}textarea{width:100%;min-height:118px;resize:vertical;padding:13px;background:#141b26;border:1px solid #526079;border-radius:6px}.result{min-height:95px;background:#182432;padding:16px;border-left:3px solid #6c9bc7;white-space:pre-wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.status{color:#f0c987;min-height:26px}.foot{border-top:1px solid #303a49;padding:13px 30px;display:flex;justify-content:space-between;gap:16px;color:#aebcd0}.muted{font-size:13px;color:#9cabbd}.focus main{grid-template-columns:1fr;max-width:980px;margin:auto}.focus .canvas{min-height:0}.focus .source{margin:10px auto;padding:20px}.focus .source .region:not([aria-pressed=true]){display:none}.focus .source h2{display:none}@media(max-width:850px){main{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.canvas{min-height:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><div><h1>翻译工作台</h1><p>核对原文，修正一处，只重译这一处。</p></div><div class="tag">交互原型 · 合成内容 · 模拟翻译，不连接网络</div></header>
<nav aria-label="视图与任务"><label for="layout" style="margin:0">布局</label><select id="layout"><option value="split">并排核对</option><option value="focus">聚焦单块</option></select><label for="view" style="margin:0">图片显示</label><select id="view"><option value="original">原图</option><option value="translated">覆盖译文</option></select><button id="all">翻译全部</button><button id="cancel">取消处理</button><button id="reset">重置演练</button></nav>
<main><section class="canvas" aria-label="原图区域"><div class="caption"><span>示例截图 · 原图保持不变</span><span>点击文字区域定位</span></div><div class="source"><h2>Sample application</h2><div id="imageRegions"></div></div><p class="muted">译文无法放入图片时，仍可在右侧阅读和复制。</p></section><section aria-label="区域编辑"><div id="regionList" class="list" aria-label="区域列表"></div><div class="editor"><div class="caption"><strong id="regionTitle"></strong><span id="regionState"></span></div><label for="draft">识别原文 · 可修正</label><textarea id="draft" spellcheck="false"></textarea><div class="actions"><button id="restore">恢复识别原文</button><label for="language" style="margin:7px 0">源语言</label><select id="language"><option value="en">英语</option><option value="auto">自动检测</option></select><span style="align-self:center">→ 简体中文</span></div><label>译文</label><div id="result" class="result" aria-live="polite"></div><div class="actions"><button id="translate" class="primary">翻译这一块</button><button id="copy">复制这一块译文</button><button id="skip">保留原文</button></div><div id="status" class="status" role="status"></div><details><summary>演练条件</summary><label><input id="fail" type="checkbox"> 本次模拟翻译失败</label><label><input id="overflow" type="checkbox"> 本次模拟译文放不下</label><p class="muted">用于验证失败后继续操作，不代表引擎质量。</p></details></div></section></main>
<div class="foot"><span id="summary"></span><span>本地会话 · 关闭后不保留内容</span></div>
<script>
const seed=[{source:'Export starts in eight seconds.',ocr:'Export starts in e1ght seconds.',translation:'导出将在八秒后开始。'},{source:'Keep the original image unchanged.',ocr:'Keep the original image unchanged.',translation:'保持原图不变。'},{source:'You can retry only the failed region.',ocr:'You can retry only the failed region.',translation:'你可以只重试失败的区域。'}];
let regions=[],selected=0,epoch=0,requests=0;
const $=id=>document.getElementById(id),labels={pending:'等待翻译',modified:'原文已修改',busy:'翻译中',done:'已译',failed:'翻译失败',cancelled:'已取消',overflow:'图片中保留原文',skipped:'保留原文'};
function init(){epoch++;regions=seed.map((x,i)=>({...x,id:'region-'+i,draft:x.ocr,result:'',state:'pending',version:0,language:'en'}));selected=0;requests=0;render()}
function render(){
 $('imageRegions').replaceChildren(...regions.map((r,i)=>{const b=document.createElement('button');b.className='region';b.setAttribute('aria-pressed',i===selected);b.dataset.region=i;b.textContent=$('view').value==='translated'&&r.state==='done'?r.result:r.source;const s=document.createElement('small');s.textContent=`${i+1} · ${labels[r.state]}`;b.append(s);b.onclick=()=>{selected=i;render()};return b}));
 $('regionList').replaceChildren(...regions.map((r,i)=>{const b=document.createElement('button');b.textContent=`区域 ${i+1} · ${labels[r.state]}`;b.setAttribute('aria-pressed',i===selected);b.onclick=()=>{selected=i;render()};return b}));
 const r=regions[selected];$('regionTitle').textContent='区域 '+(selected+1);$('regionState').textContent=labels[r.state];$('draft').value=r.draft;$('language').value=r.language;$('result').textContent=r.result||'暂无译文';$('translate').disabled=r.state==='busy'||!r.draft.trim();$('copy').disabled=!r.result;$('status').textContent=r.state==='overflow'?'译文仍可阅读和复制；图片保留原文。':r.state==='failed'?'翻译失败，原文已保留。可以修正后重试。':r.state==='modified'?'旧译文已失效，重译后更新这一块。':'';$('summary').textContent=`${regions.filter(x=>x.state==='done').length} / ${regions.length} 块已译 · 本次演练发起 ${requests} 次区域请求`;
}
function edit(text){const r=regions[selected];r.draft=text;r.version++;r.result='';r.state='modified';render()}
async function translate(i){const r=regions[i];if(!r.draft.trim())return;const version=++r.version,run=epoch,fail=$('fail').checked,overflow=$('overflow').checked,input=r.draft;r.state='busy';r.result='';requests++;render();await new Promise(done=>setTimeout(done,450));if(run!==epoch||version!==r.version)return;r.result=fail?'':(input.includes('e1ght')?'导出将在 e1ght 秒后开始。':r.translation);r.state=fail?'failed':overflow?'overflow':'done';render()}
$('draft').oninput=e=>{const start=e.target.selectionStart,end=e.target.selectionEnd;edit(e.target.value);$('draft').focus();$('draft').setSelectionRange(start,end)};
$('restore').onclick=()=>edit(regions[selected].ocr);$('language').onchange=e=>{regions[selected].language=e.target.value;edit(regions[selected].draft)};
$('translate').onclick=()=>translate(selected);$('all').onclick=()=>Promise.all(regions.map((r,i)=>r.state==='skipped'?null:translate(i)));
$('cancel').onclick=()=>{regions.forEach(r=>{if(r.state==='busy'){r.version++;r.state='cancelled'}});render()};
$('skip').onclick=()=>{const r=regions[selected];r.version++;r.result='';r.state='skipped';render()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(regions[selected].result);$('status').textContent='已复制译文'}catch{$('status').textContent='剪贴板不可用，请在译文区域选择文字复制。'}};
$('view').onchange=render;$('layout').onchange=e=>document.body.classList.toggle('focus',e.target.value==='focus');$('reset').onclick=init;init();
window.prototypeState=()=>({regions:regions.map(r=>({...r})),requests,selected});
</script></html>
